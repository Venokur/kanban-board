services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "${DEV_PORT:-5173}:5173"
    depends_on:
      app:
        condition: service_healthy

volumes:
  frontend_node_modules:
