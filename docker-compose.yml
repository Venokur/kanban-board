name: kanban-board

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kanban}
      POSTGRES_USER: ${POSTGRES_USER:-kanban}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kanban}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kanban} -d ${POSTGRES_DB:-kanban}"]
      interval: 5s
      timeout: 5s
      retries: 15

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-kanban}
      DB_USER: ${POSTGRES_USER:-kanban}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-kanban}
      APP_HOST: 0.0.0.0
      APP_PORT: 9501
      APP_DEBUG: ${APP_DEBUG:-0}
      APP_SECRET: ${APP_SECRET:-kanban-csrf-secret}
      APP_DEMO: ${APP_DEMO:-1}
      APP_HTTPS: ${APP_HTTPS:-0}
      APP_LEGACY_TOKEN: ${APP_LEGACY_TOKEN:-0}
      APP_WS_QUERY_TOKEN: ${APP_WS_QUERY_TOKEN:-0}
      SWOOLE_VARIANT: ${SWOOLE_VARIANT:-openswoole}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-9501}:9501"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9501/api/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
